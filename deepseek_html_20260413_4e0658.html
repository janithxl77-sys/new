<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stainless Steel with Daya Engineering | Video Animation Website</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Three.js for 3D Animation -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            overflow-x: hidden;
            color: white;
        }

        /* Canvas for 3D Background */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        /* Video Overlay Layer */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .video-overlay video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4;
            mix-blend-mode: overlay;
        }

        /* Main Content */
        .content {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
        }

        /* Header */
        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, rgba(0,0,0,0.7), rgba(44,62,102,0.7));
            border-bottom: 3px solid #ffd700;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        header h1 i {
            color: #ffd700;
            margin-right: 10px;
        }

        .contact-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .contact-bar a {
            color: white;
            text-decoration: none;
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 50px;
            transition: 0.3s;
        }

        .contact-bar a:hover {
            background: #ffd700;
            color: #1a1a2e;
            transform: translateY(-3px);
        }

        /* Weather Panel */
        .weather-panel {
            background: rgba(0,0,0,0.6);
            margin: 20px;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,215,0,0.3);
        }

        .weather-panel h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        #weather-info {
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .weather-card {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 15px;
            display: inline-block;
        }

        .location-select {
            margin-top: 15px;
        }

        .location-select select {
            padding: 10px 20px;
            border-radius: 30px;
            background: #1a1a2e;
            color: white;
            border: 1px solid #ffd700;
            cursor: pointer;
        }

        /* Products Section */
        .products-section {
            padding: 30px 20px;
        }

        .products-section h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .products-section h2 i {
            color: #ffd700;
            margin-right: 10px;
        }

        .product-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background: rgba(255,255,255,0.95);
            color: #1a1a2e;
            border-radius: 20px;
            width: 280px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .product-img {
            height: 220px;
            overflow: hidden;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .product-card:hover .product-img img {
            transform: scale(1.1);
        }

        .product-info {
            padding: 15px;
        }

        .product-info h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .price {
            color: #e67e22;
            font-weight: bold;
            font-size: 1.3rem;
            margin: 10px 0;
        }

        .like-btn, .comment-btn {
            background: #2c3e66;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .like-btn:hover, .comment-btn:hover {
            background: #ffd700;
            color: #1a1a2e;
        }

        .likes-count {
            display: inline-block;
            margin-left: 10px;
            font-weight: bold;
        }

        .comments-section {
            margin-top: 10px;
            font-size: 0.85rem;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }

        /* Admin Login Button */
        .admin-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ffd700;
            color: #1a1a2e;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .admin-btn:hover {
            transform: scale(1.1);
        }

        /* Modal for Admin */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            color: #1a1a2e;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .close {
            float: right;
            font-size: 28px;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 { font-size: 1.5rem; }
            .contact-bar { gap: 10px; }
            .product-card { width: 90%; }
        }

        /* Steel Texture Animation */
        @keyframes steelShine {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
            100% { filter: brightness(1); }
        }
    </style>
</head>
<body>

    <!-- 3D Canvas Background -->
    <div id="canvas-container"></div>

    <!-- Video Overlay -->
    <div class="video-overlay">
        <video autoplay loop muted playsinline id="bg-video">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-polished-metal-surface-2276-large.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Main Content -->
    <div class="content">
        <header>
            <h1><i class="fas fa-industry"></i> Stainless Steel with Daya Engineering</h1>
            <p>📍 Nagolla, Dambulla Road</p>
            <div class="contact-bar">
                <a href="tel:+94771234567"><i class="fas fa-phone"></i> 077-1234567</a>
                <a href="https://wa.me/94771234567"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                <a href="#"><i class="fas fa-map-marker-alt"></i> Location Map</a>
            </div>
        </header>

        <!-- Weather Panel -->
        <div class="weather-panel">
            <h3><i class="fas fa-cloud-sun"></i> කාලගුණය හා උෂ්ණත්වය</h3>
            <div id="weather-info">
                <div class="weather-card"><i class="fas fa-thermometer-half"></i> පූරණය වෙමින්...</div>
            </div>
            <div class="location-select">
                <label><i class="fas fa-location-dot"></i> ස්ථානය තෝරන්න: </label>
                <select id="location-select">
                    <option value="Hettipola">Hettipola</option>
                    <option value="Wilgamuwa">Wilgamuwa</option>
                    <option value="Mathale">Mathale</option>
                    <option value="Sri Lanka">Sri Lanka (Colombo)</option>
                </select>
            </div>
        </div>

        <!-- Products Section -->
        <div class="products-section">
            <h2><i class="fas fa-gem"></i> අපගේ නිෂ්පාදන</h2>
            <div class="product-grid" id="product-grid">
                <!-- Products will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Admin Button -->
    <div class="admin-btn" onclick="openAdminModal()">
        <i class="fas fa-user-shield"></i>
    </div>

    <!-- Admin Modal -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAdminModal()">&times;</span>
            <h2><i class="fas fa-lock"></i> Admin Login</h2>
            <input type="password" id="admin-password" placeholder="Enter Admin Password">
            <button onclick="adminLogin()">Login</button>
            <div id="admin-error" style="color:red; margin-top:10px;"></div>
            
            <div id="admin-panel" style="display:none; margin-top:20px;">
                <hr>
                <h3>Add New Product</h3>
                <input type="text" id="prod-name" placeholder="Product Name">
                <textarea id="prod-desc" placeholder="Description"></textarea>
                <input type="text" id="prod-price" placeholder="Price (LKR)">
                <input type="text" id="prod-image" placeholder="Image URL (Pexels/Unsplash)">
                <button onclick="addProduct()">Add Product</button>
                
                <hr>
                <h3>Fake Likes</h3>
                <select id="fake-product-select"></select>
                <input type="number" id="fake-likes-count" placeholder="Number of likes">
                <button onclick="addFakeLikes()">Add Fake Likes</button>
                
                <hr>
                <h3>Fake Comment</h3>
                <select id="comment-product-select"></select>
                <input type="text" id="fake-comment-text" placeholder="Fake comment">
                <button onclick="addFakeComment()">Add Fake Comment</button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // 3D Animation Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        container.appendChild(renderer.domElement);
        
        // Create a rotating steel torus knot
        const geometry = new THREE.TorusKnotGeometry(1, 0.3, 200, 32, 3, 4);
        const material = new THREE.MeshStandardMaterial({
            color: 0xc0c0c0,
            metalness: 0.9,
            roughness: 0.3,
            emissive: 0x222222,
            emissiveIntensity: 0.3
        });
        const knot = new THREE.Mesh(geometry, material);
        scene.add(knot);
        
        // Add floating steel spheres
        const sphereMat = new THREE.MeshStandardMaterial({
            color: 0xaaaaaa,
            metalness: 0.85,
            roughness: 0.2
        });
        const spheres = [];
        for(let i = 0; i < 30; i++) {
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), sphereMat);
            sphere.position.x = (Math.random() - 0.5) * 10;
            sphere.position.y = (Math.random() - 0.5) * 8;
            sphere.position.z = (Math.random() - 0.5) * 8 - 3;
            scene.add(sphere);
            spheres.push(sphere);
        }
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(2, 5, 3);
        scene.add(directionalLight);
        const backLight = new THREE.PointLight(0x4466cc, 0.5);
        backLight.position.set(-2, 1, -3);
        scene.add(backLight);
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            knot.rotation.x += 0.008;
            knot.rotation.y += 0.012;
            knot.rotation.z += 0.005;
            
            spheres.forEach((sphere, idx) => {
                sphere.position.x += Math.sin(Date.now() * 0.001 + idx) * 0.002;
                sphere.position.y += Math.cos(Date.now() * 0.0008 + idx) * 0.002;
            });
            
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

    <script>
        // ============= PRODUCT DATA (localStorage) =============
        let products = [];
        
        // Load products from localStorage
        function loadProductsFromStorage() {
            const stored = localStorage.getItem('steel_products');
            if(stored) {
                products = JSON.parse(stored);
            } else {
                // Default products
                products = [
                    { id: 1, name: "Stainless Steel Sheet 304", description: "High quality 304 grade, 2mm thickness", price: "12,500", image: "https://images.pexels.com/photos/239309/pexels-photo-239309.jpeg?w=400", likes: 15, comments: ["Very good quality!", "Fast delivery"] },
                    { id: 2, name: "Steel Round Bar", description: "Diameter 20mm, 6m length", price: "8,900", image: "https://images.pexels.com/photos/210600/pexels-photo-210600.jpeg?w=400", likes: 8, comments: ["Strong material"] },
                    { id: 3, name: "Mirror Finish Sheet", description: "8K mirror polished, 1mm", price: "18,500", image: "https://images.pexels.com/photos/1181415/pexels-photo-1181415.jpeg?w=400", likes: 22, comments: ["Beautiful shine!"] }
                ];
                saveProducts();
            }
            renderProducts();
        }
        
        function saveProducts() {
            localStorage.setItem('steel_products', JSON.stringify(products));
        }
        
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            if(!grid) return;
            grid.innerHTML = '';
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img">
                        <img src="${product.image}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/400?text=Steel'">
                    </div>
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <p>${product.description}</p>
                        <div class="price">රු ${product.price}</div>
                        <button class="like-btn" onclick="likeProduct(${product.id})"><i class="fas fa-thumbs-up"></i> Like</button>
                        <span class="likes-count" id="likes-${product.id}">❤️ ${product.likes}</span>
                        <button class="comment-btn" onclick="promptComment(${product.id})"><i class="fas fa-comment"></i> Comment</button>
                        <div class="comments-section" id="comments-${product.id}">
                            ${product.comments.slice(-3).map(c => `💬 ${c}<br>`).join('')}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            updateAdminSelects();
        }
        
        function likeProduct(id) {
            const product = products.find(p => p.id === id);
            if(product) {
                product.likes++;
                saveProducts();
                const span = document.getElementById(`likes-${id}`);
                if(span) span.innerHTML = `❤️ ${product.likes}`;
            }
        }
        
        function promptComment(id) {
            const comment = prompt("ඔබේ අදහස ලියන්න:");
            if(comment) {
                const product = products.find(p => p.id === id);
                if(product) {
                    product.comments.push(comment);
                    saveProducts();
                    renderProducts();
                }
            }
        }
        
        // Admin Functions
        let adminLoggedIn = false;
        const ADMIN_PASSWORD = "daya123"; // Change this!
        
        function openAdminModal() {
            document.getElementById('admin-modal').style.display = 'flex';
        }
        
        function closeAdminModal() {
            document.getElementById('admin-modal').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('admin-password').value = '';
        }
        
        function adminLogin() {
            const pwd = document.getElementById('admin-password').value;
            if(pwd === ADMIN_PASSWORD) {
                adminLoggedIn = true;
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('admin-error').innerHTML = '';
                updateAdminSelects();
            } else {
                document.getElementById('admin-error').innerHTML = 'Wrong password!';
            }
        }
        
        function updateAdminSelects() {
            const prodSelect1 = document.getElementById('fake-product-select');
            const prodSelect2 = document.getElementById('comment-product-select');
            if(prodSelect1 && prodSelect2) {
                prodSelect1.innerHTML = '';
                prodSelect2.innerHTML = '';
                products.forEach(p => {
                    const opt1 = document.createElement('option');
                    opt1.value = p.id;
                    opt1.text = p.name;
                    prodSelect1.appendChild(opt1);
                    
                    const opt2 = document.createElement('option');
                    opt2.value = p.id;
                    opt2.text = p.name;
                    prodSelect2.appendChild(opt2);
                });
            }
        }
        
        function addProduct() {
            const name = document.getElementById('prod-name').value;
            const desc = document.getElementById('prod-desc').value;
            const price = document.getElementById('prod-price').value;
            let image = document.getElementById('prod-image').value;
            if(!image) image = "https://images.pexels.com/photos/239309/pexels-photo-239309.jpeg?w=400";
            
            if(name && price) {
                const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 4;
                products.push({
                    id: newId,
                    name: name,
                    description: desc || "High quality stainless steel",
                    price: price,
                    image: image,
                    likes: 0,
                    comments: []
                });
                saveProducts();
                renderProducts();
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-desc').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-image').value = '';
                alert("Product added!");
            } else {
                alert("Please fill Name and Price");
            }
        }
        
        function addFakeLikes() {
            const select = document.getElementById('fake-product-select');
            const productId = parseInt(select.value);
            const likesCount = parseInt(document.getElementById('fake-likes-count').value);
            const product = products.find(p => p.id === productId);
            if(product && likesCount > 0) {
                product.likes += likesCount;
                saveProducts();
                renderProducts();
                alert(`Added ${likesCount} fake likes to ${product.name}`);
                document.getElementById('fake-likes-count').value = '';
            }
        }
        
        function addFakeComment() {
            const select = document.getElementById('comment-product-select');
            const productId = parseInt(select.value);
            const comment = document.getElementById('fake-comment-text').value;
            const product = products.find(p => p.id === productId);
            if(product && comment) {
                product.comments.push(`⭐ ${comment}`);
                saveProducts();
                renderProducts();
                alert(`Added fake comment to ${product.name}`);
                document.getElementById('fake-comment-text').value = '';
            }
        }
        
        // Weather API with Temperature
        async function getWeather(location) {
            const weatherDiv = document.getElementById('weather-info');
            weatherDiv.innerHTML = '<div class="weather-card"><i class="fas fa-spinner fa-spin"></i> Loading weather...</div>';
            
            // Location coordinates mapping
            const coords = {
                'Hettipola': { lat: 7.55, lon: 80.35 },
                'Wilgamuwa': { lat: 7.65, lon: 80.85 },
                'Mathale': { lat: 7.47, lon: 80.62 },
                'Sri Lanka': { lat: 6.93, lon: 79.86 }
            };
            
            const loc = coords[location] || coords['Sri Lanka'];
            const apiKey = 'bd5e378503939ddaee76f12ad7a97608'; // Free demo key - replace with yours
            
            try {
                const url = `https://api.openweathermap.org/data/2.5/weather?lat=${loc.lat}&lon=${loc.lon}&appid=${apiKey}&units=metric`;
                const response = await fetch(url);
                const data = await response.json();
                
                if(data.main) {
                    weatherDiv.innerHTML = `
                        <div class="weather-card"><i class="fas fa-temperature-high"></i> ${data.main.temp}°C</div>
                        <div class="weather-card"><i class="fas fa-cloud"></i> ${data.weather[0].description}</div>
                        <div class="weather-card"><i class="fas fa-tint"></i> Humidity: ${data.main.humidity}%</div>
                        <div class="weather-card"><i class="fas fa-wind"></i> Wind: ${data.wind.speed} m/s</div>
                    `;
                    
                    // Change video based on weather
                    const video = document.getElementById('bg-video');
                    const weatherMain = data.weather[0].main.toLowerCase();
                    if(weatherMain.includes('rain')) {
                        video.style.opacity = '0.6';
                    } else if(weatherMain.includes('cloud')) {
                        video.style.opacity = '0.4';
                    } else {
                        video.style.opacity = '0.3';
                    }
                } else {
                    weatherDiv.innerHTML = '<div class="weather-card">Weather data unavailable</div>';
                }
            } catch(e) {
                weatherDiv.innerHTML = '<div class="weather-card">Weather API error</div>';
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadProductsFromStorage();
            
            const locSelect = document.getElementById('location-select');
            getWeather(locSelect.value);
            
            locSelect.addEventListener('change', (e) => {
                getWeather(e.target.value);
            });
            
            // Refresh weather every 5 minutes
            setInterval(() => {
                getWeather(locSelect.value);
            }, 300000);
        });
    </script>
</body>
</html>
